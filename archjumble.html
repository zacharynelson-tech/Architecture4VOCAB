<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ArchJumble — Grade 12</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --ink: #1C1E21; --sub: #6B7280; --line: #D8D5CC;

  --accent: #2563EB; --accent-soft: #EFF4FF;
  --good: #15803D; --good-soft: #EAF7EE;
  --bad: #B91C1C; --bad-soft: #FDEEEE;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #EDEDED; --sub: #9AA0A6; --line: #3A3A3C;
    --bg: #121213; --card: #1E1E1F; --accent-soft: #1B2A4A; --good-soft: #163822; --bad-soft: #3A1A1A;
  }
}
:root[data-theme="dark"] {
  --ink: #EDEDED; --sub: #9AA0A6; --line: #3A3A3C;
  --bg: #121213; --card: #1E1E1F; --accent-soft: #1B2A4A; --good-soft: #163822; --bad-soft: #3A1A1A;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 12px 40px;
}
.wrap { width: 100%; max-width: 480px; }
header { text-align: center; margin-bottom: 6px; }
h1 { font-size: 22px; font-weight: 800; margin: 4px 0 2px; letter-spacing: -0.02em; }
.sub { font-size: 13px; color: var(--sub); margin: 0 0 14px; }
.controls-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
#cycle-select {
  font-size: 13px; font-weight: 700; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; max-width: 100%;
}
button.action {
  background: var(--accent); color: #fff; border: none; border-radius: 999px;
  font-size: 13px; font-weight: 700; padding: 8px 16px; cursor: pointer;
}
button.action.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
#score-pill { display: block; text-align: center; font-size: 12.5px; color: var(--sub); margin-bottom: 10px; }
#clue-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px; margin-bottom: 18px; text-align: center;
}
#clue-text { font-size: 14.5px; line-height: 1.4; margin: 0; color: var(--sub); font-style: italic; }
.segments { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-bottom: 18px; }
.segment { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.sep-char { font-size: 20px; color: var(--sub); align-self: center; margin-top: 20px; }
.answer-row, .scramble-row { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.tile {
  width: 34px; height: 34px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer;
  user-select: none; -webkit-user-select: none;
}
.answer-row .tile { background: var(--bg); border: 2px solid var(--line); color: var(--ink); }
.answer-row .tile.filled { background: var(--accent-soft); border-color: var(--accent); cursor: pointer; }
.scramble-row .tile { background: var(--card); border: 2px solid var(--line); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.scramble-row .tile.used { visibility: hidden; }
#message { text-align: center; font-size: 14px; font-weight: 700; min-height: 20px; margin-bottom: 10px; }
#message.good { color: var(--good); }
#message.bad { color: var(--bad); }
#result-panel {
  display: none; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px; margin-top: 10px; text-align: center;
}
#result-panel.show { display: block; animation: popIn 0.25s ease-out; }
@keyframes popIn {
  from { opacity: 0; transform: scale(0.92) translateY(6px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
#result-term { font-size: 18px; font-weight: 800; margin: 0 0 4px; }
#result-def { font-size: 13.5px; color: var(--sub); margin: 0; line-height: 1.4; }
.actions-row { display: flex; justify-content: center; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.back-link {
  display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;
  color: var(--sub); text-decoration: none; margin-bottom: 10px;
}
.back-link:hover { color: var(--accent); }
</style>
</head>

<header>
<a class="back-link" href="index.html">&larr; Back to Games</a>

</header>

</div>

function displayOf(entry) {
  return entry.display || (entry.term.charAt(0).toUpperCase() + entry.term.slice(1));
}

function tokenize(term) {
  const tokens = [];
  const regex = /([a-z]+)|([\s\-\/]+)/g;
  let m;
  const lower = term.toLowerCase();
  while ((m = regex.exec(lower)) !== null) {
    if (m[1]) tokens.push({ type: "word", letters: m[1].split("") });
    else {
      let ch = " ";
      if (m[2].includes("-")) ch = "-";
      else if (m[2].includes("/")) ch = "/";
      tokens.push({ type: "sep", char: ch });
    }
  }
  return tokens;
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function scrambleWordToken(letters, maxAttempts) {
  if (letters.length <= 1) return letters.slice();
  for (let i = 0; i < maxAttempts; i++) {
    const s = shuffleArray(letters);
    if (s.join("") !== letters.join("")) return s;
  }
  return shuffleArray(letters);
}

function dedupedPool(cycleList) {
  const seen = new Set();
  const pool = [];
  cycleList.forEach(c => c.words.forEach(w => {
    if (!seen.has(w.term)) { seen.add(w.term); pool.push(w); }
  }));
  return pool;
}

function populateCycleSelect() {
  const sel = document.getElementById("cycle-select");
  const allOpt = document.createElement("option");
  allOpt.value = "all";
  allOpt.textContent = "All Cycles";
  sel.appendChild(allOpt);
  CYCLES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = String(c.num);
    const rangeLabel = c.num === 1 ? "Cycle 1" : "Cycles 1\u2013" + c.num;
    opt.textContent = rangeLabel + " \u2014 through " + c.title;
    sel.appendChild(opt);
  });
  sel.value = "all";
  sel.addEventListener("change", newWord);
}

function getActivePool() {
  const sel = document.getElementById("cycle-select");
  if (sel.value === "all") return dedupedPool(CYCLES);
  const selectedNum = parseInt(sel.value, 10);
  return dedupedPool(CYCLES.filter(c => c.num <= selectedNum));
}

let current = null; // {entry, tokens, wordTokens: [{letters, scrambled, filled: [], used: []}]}
let solvedCount = 0;
let attemptedCount = 0;
let streak = 0;
let bestStreak = 0;

function newWord() {
  const pool = getActivePool();
  const entry = pool[Math.floor(Math.random() * pool.length)];
  const tokens = tokenize(entry.term);
  const wordTokens = tokens.filter(t => t.type === "word").map(t => ({
    letters: t.letters,
    scrambled: scrambleWordToken(t.letters, 20),
    filled: new Array(t.letters.length).fill(null),   // holds {char, scrambleIdx} or null
    used: new Array(t.letters.length).fill(false),    // which scrambled tiles are used (by index)
  }));
  current = { entry, tokens, wordTokens };
  document.getElementById("result-panel").classList.remove("show");
  document.getElementById("message").textContent = "";
  document.getElementById("message").className = "";
  document.getElementById("clue-text").textContent = "Unscramble the term below \u2014 the definition will reveal once you solve it.";
  renderSegments();
  updateScore();
}

function updateScore() {
  const streakText = streak > 0 ? ` \u00b7 \ud83d\udd25 Streak: ${streak}` : "";
  const bestText = bestStreak > 0 ? ` (best: ${bestStreak})` : "";
  document.getElementById("score-pill").textContent = `Solved ${solvedCount} of ${attemptedCount} attempted${streakText}${bestText}`;
}

function renderSegments() {
  const wrap = document.getElementById("segments-wrap");
  wrap.innerHTML = "";
  let wordIdx = 0;
  current.tokens.forEach(tok => {
    if (tok.type === "sep") {
      const sepEl = document.createElement("div");
      sepEl.className = "sep-char";
      sepEl.textContent = tok.char === " " ? "\u00A0\u00A0" : tok.char;
      wrap.appendChild(sepEl);
      return;
    }
    const capturedWordIdx = wordIdx; // fix: freeze this iteration's index for the closures below
    const wt = current.wordTokens[capturedWordIdx];
    const segDiv = document.createElement("div");
    segDiv.className = "segment";

    const answerRow = document.createElement("div");
    answerRow.className = "answer-row";
    wt.filled.forEach((f, slotIdx) => {
      const tile = document.createElement("div");
      tile.className = "tile" + (f ? " filled" : "");
      tile.textContent = f ? f.char : "";
      if (f) tile.addEventListener("click", () => unfillSlot(capturedWordIdx, slotIdx));
      answerRow.appendChild(tile);
    });

    const scrambleRow = document.createElement("div");
    scrambleRow.className = "scramble-row";
    wt.scrambled.forEach((ch, si) => {
      const tile = document.createElement("div");
      tile.className = "tile" + (wt.used[si] ? " used" : "");
      tile.textContent = ch;
      tile.addEventListener("click", () => fillNext(capturedWordIdx, si));
      scrambleRow.appendChild(tile);
    });

    segDiv.appendChild(answerRow);
    segDiv.appendChild(scrambleRow);
    wrap.appendChild(segDiv);
    wordIdx++;
  });
}

function fillNext(wordIdx, scrambleIdx) {
  const wt = current.wordTokens[wordIdx];
  if (wt.used[scrambleIdx]) return;
  const nextSlot = wt.filled.findIndex(f => f === null);
  if (nextSlot === -1) return;
  wt.filled[nextSlot] = { char: wt.scrambled[scrambleIdx], scrambleIdx };
  wt.used[scrambleIdx] = true;
  renderSegments();
  checkIfComplete();
}

function unfillSlot(wordIdx, slotIdx) {
  const wt = current.wordTokens[wordIdx];
  const f = wt.filled[slotIdx];
  if (!f) return;
  wt.used[f.scrambleIdx] = false;
  wt.filled[slotIdx] = null;
  renderSegments();
}

function allSegmentsFull() {
  return current.wordTokens.every(wt => wt.filled.every(f => f !== null));
}

function checkIfComplete() {
  if (!allSegmentsFull()) return;
  attemptedCount++;
  const correct = current.wordTokens.every(wt => wt.filled.map(f => f.char).join("") === wt.letters.join(""));
  const msg = document.getElementById("message");
  if (correct) {
    solvedCount++;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    msg.textContent = "Correct!";
    msg.className = "good";
    showReveal(true);
  } else {
    msg.textContent = "Not quite \u2014 try rearranging.";
    msg.className = "bad";
  }
  updateScore();
}

function showReveal(wasSolved) {
  document.getElementById("result-label").textContent = wasSolved ? "Solved!" : "Here's the answer";
  document.getElementById("result-label").style.color = wasSolved ? "var(--good)" : "var(--sub)";
  document.getElementById("result-term").textContent = displayOf(current.entry);
  document.getElementById("result-def").textContent = current.entry.def;
  document.getElementById("result-panel").classList.add("show");
}

function shuffleCurrent() {
  current.wordTokens.forEach(wt => {
    // only reshuffle the letters not yet placed, keep placed ones untouched
    const remainingIndices = wt.scrambled.map((_, i) => i).filter(i => !wt.used[i]);
    const remainingLetters = remainingIndices.map(i => wt.scrambled[i]);
    const reshuffled = shuffleArray(remainingLetters);
    remainingIndices.forEach((origIdx, k) => { wt.scrambled[origIdx] = reshuffled[k]; });
  });
  renderSegments();
}

function giveHint() {
  for (const wt of current.wordTokens) {
    const slot = wt.filled.findIndex(f => f === null);
    if (slot === -1) continue;
    const correctChar = wt.letters[slot];
    const scrambleIdx = wt.scrambled.findIndex((ch, i) => ch === correctChar && !wt.used[i]);
    if (scrambleIdx !== -1) {
      wt.filled[slot] = { char: wt.scrambled[scrambleIdx], scrambleIdx };
      wt.used[scrambleIdx] = true;
      renderSegments();
      checkIfComplete();
      return;
    }
  }
}

function giveUp() {
  attemptedCount++;
  streak = 0;
  current.wordTokens.forEach(wt => {
    wt.filled = wt.letters.map(ch => ({ char: ch, scrambleIdx: -1 }));
    wt.used = wt.used.map(() => true);
  });
  renderSegments();
  document.getElementById("message").textContent = "";
  showReveal(false);
  updateScore();
}

document.getElementById("new-word-btn").addEventListener("click", newWord);
document.getElementById("shuffle-btn").addEventListener("click", shuffleCurrent);
document.getElementById("hint-btn").addEventListener("click", giveHint);
document.getElementById("giveup-btn").addEventListener("click", giveUp);

populateCycleSelect();
const urlParams = new URLSearchParams(window.location.search);
const cycleParam = urlParams.get("cycle");
if (cycleParam && (cycleParam === "all" || CYCLES.some(c => String(c.num) === cycleParam))) {
  document.getElementById("cycle-select").value = cycleParam;
}
newWord();
</script>
</body>
</html>
