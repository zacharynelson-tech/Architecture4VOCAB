<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ArchWordle — Grade 12</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --ink: #1C1E21; --sub: #6B7280; --line: #D8D5CC;
  --bg: #FAF9F6; --card: #FFFFFF;
  --accent: #2563EB;
  --green: #6AAA64; --yellow: #C9B458; --gray: #787C7E;
  --key-bg: #D3D6DA; --key-text: #1C1E21;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #EDEDED; --sub: #9AA0A6; --line: #3A3A3C;
    --bg: #121213; --card: #1E1E1F;
    --key-bg: #565758; --key-text: #EDEDED;
  }
}
:root[data-theme="dark"] {
  --ink: #EDEDED; --sub: #9AA0A6; --line: #3A3A3C;
  --bg: #121213; --card: #1E1E1F;
  --key-bg: #565758; --key-text: #EDEDED;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 12px 32px;
}
.wrap { width: 100%; max-width: 460px; }
header { text-align: center; margin-bottom: 6px; }
h1 { font-size: 22px; font-weight: 800; margin: 4px 0 2px; letter-spacing: -0.02em; }
.sub { font-size: 13px; color: var(--sub); margin: 0 0 14px; }
.meta-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.pill { font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--sub); }
#cycle-select {
  font-size: 13px; font-weight: 700; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  max-width: 100%;
}
#board {
  display: flex; flex-direction: column; gap: 6px; margin: 0 auto 16px;
  align-items: center;
}
.row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
.tile {
  width: 34px; height: 34px; border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; text-transform: uppercase;
  border-radius: 4px; background: var(--card); color: var(--ink);
  transition: transform 0.15s;
  flex: none;
}
.tile.filled { border-color: var(--sub); }
.tile.green { background: var(--green); border-color: var(--green); color: #fff; }
.tile.yellow { background: var(--yellow); border-color: var(--yellow); color: #fff; }
.tile.gray { background: var(--gray); border-color: var(--gray); color: #fff; }
#message {
  min-height: 20px; text-align: center; font-size: 14px; font-weight: 700;
  margin-bottom: 10px; color: var(--accent);
}
#keyboard { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.krow { display: flex; gap: 5px; }
.key {
  background: var(--key-bg); color: var(--key-text); border: none;
  border-radius: 4px; font-size: 12px; font-weight: 700; text-transform: uppercase;
  padding: 0; height: 42px; min-width: 28px; flex: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.key.wide { flex: 1.6; font-size: 10px; }
.key.symbol { flex: 0.8; font-size: 16px; }
.key.space { flex: 3; font-size: 11px; }
.key.green { background: var(--green); color: #fff; }
.key.yellow { background: var(--yellow); color: #fff; }
.key.gray { background: var(--gray); color: #fff; }
#result-panel {
  display: none; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px; margin-top: 14px; text-align: center;
}
#result-panel.show { display: block; }
#result-term { font-size: 18px; font-weight: 800; margin: 0 0 4px; }
#result-def { font-size: 13.5px; color: var(--sub); margin: 0 0 12px; line-height: 1.4; }
button.action {
  background: var(--accent); color: #fff; border: none; border-radius: 999px;
  font-size: 14px; font-weight: 700; padding: 10px 20px; cursor: pointer;
}
.back-link {
  display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;
  color: var(--sub); text-decoration: none; margin-bottom: 10px;
}
.back-link:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
<header>
<a class="back-link" href="index.html">&larr; Back to Games</a>
<h1>ArchWordle</h1>
<p class="sub">Guess this year's architecture vocabulary — one term at a time.</p>
</header>
<div class="meta-row">
  <select id="cycle-select"></select>
</div>
<div class="meta-row">
  <span class="pill" id="length-pill">7 letters</span>
  <span class="pill" id="guess-pill">Guess 1 of 6</span>
</div>
<div id="board"></div>
<div id="message"></div>
<div id="keyboard"></div>
<div id="result-panel">
  <p id="result-term"></p>
  <p id="result-def"></p>
  <button class="action" id="new-word-btn">New word</button>
</div>
</div>
<script>
const CYCLES = [

  { num: 4, title: "Site Analysis & Design", words: [

  { num: 5, title: "Materials & Assemblies", words: [

    {term:"glu-lam", display:"Glu-Lam", def:"Glued-laminated timber: layers of lumber bonded with adhesive to make a large beam or column."},
    {term:"cross-laminated timber", def:"An engineered wood panel made of layers of boards stacked at right angles and glued together."},
    {term:"dowel-laminated timber", def:"An engineered wood panel made of boards joined with hardwood pins instead of glue."},
    {term:"hvac systems", display:"HVAC systems", def:"Heating, ventilating, and air-conditioning equipment that conditions a building's indoor air."},

    {term:"lighting levels", def:"The amount of illumination recommended for a visual task, measured in foot-candles or lux."},

    {term:"assembly layers", def:"The stacked materials that make up a wall, floor, or roof, defined one by one in a Revit type."},
    {term:"materials", def:"In Revit, named surface and physical definitions, such as brick or concrete, assigned to elements."},

    {term:"location", def:"A sustainability category about choosing building sites that connect well to the surrounding community."},

    {term:"sustainable site", def:"A LEED category about reducing construction pollution, choosing suitable land, protecting habitat, and managing runoff."},
    {term:"water efficiency", def:"A LEED category about using less drinking water through efficient fixtures, rainwater capture, and graywater."},
    {term:"energy and atmosphere", def:"A LEED category about improving how efficiently buildings acquire and use power, using renewables, and reducing harmful emissions."},

const MAX_GUESSES = 6;
let target, guesses, currentGuess, gameOver, wordLen;

function populateCycleSelect() {
  const sel = document.getElementById("cycle-select");
  const allOpt = document.createElement("option");
  allOpt.value = "all";
  allOpt.textContent = "All Cycles";
  sel.appendChild(allOpt);
  CYCLES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = String(c.num);
    const rangeLabel = c.num === 1 ? "Cycle 1" : "Cycles 1\u2013" + c.num;
    opt.textContent = rangeLabel + " \u2014 through " + c.title;
    sel.appendChild(opt);
  });
  sel.value = "all";
  sel.addEventListener("change", startGame);
}

function dedupedPool(cycleList) {
  const seen = new Set();
  const pool = [];
  cycleList.forEach(c => c.words.forEach(w => {
    if (!seen.has(w.term)) { seen.add(w.term); pool.push(w); }
  }));
  return pool;
}

function getActivePool() {
  const sel = document.getElementById("cycle-select");
  if (sel.value === "all") {
    return dedupedPool(CYCLES);
  }
  const selectedNum = parseInt(sel.value, 10);
  const cumulativeCycles = CYCLES.filter(c => c.num <= selectedNum);
  return dedupedPool(cumulativeCycles);
}

function pickWord() {
  const pool = getActivePool();
  return pool[Math.floor(Math.random() * pool.length)];
}

function startGame() {
  const entry = pickWord();
  target = entry;
  wordLen = entry.term.length;
  guesses = [];
  currentGuess = new Array(wordLen).fill("");
  gameOver = false;
  document.getElementById("result-panel").classList.remove("show");
  document.getElementById("message").textContent = "";
  const wordCount = entry.term.split(/[\s\-\/]+/).length;
  document.getElementById("length-pill").textContent = wordLen + " characters" + (wordCount > 1 ? " \u00b7 " + wordCount + " words" : "");
  document.getElementById("guess-pill").textContent = "Guess 1 of " + MAX_GUESSES;
  renderBoard();
  renderKeyboard();
}

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (let r = 0; r < MAX_GUESSES; r++) {
    const row = document.createElement("div");
    row.className = "row";
    const guessData = guesses[r];
    const isCurrent = r === guesses.length;
    for (let c = 0; c < wordLen; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      let letter = "";
      if (guessData) {
        letter = guessData.chars[c];
        tile.classList.add(guessData.states[c]);
      } else if (isCurrent && currentGuess[c]) {
        letter = currentGuess[c];
        tile.classList.add("filled");
      }
      tile.textContent = letter === " " ? "\u2423" : letter;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

function evaluateGuess(guessChars) {
  const targetChars = target.term.toLowerCase().split("");
  const states = new Array(wordLen).fill("gray");
  const counts = {};
  targetChars.forEach(ch => { counts[ch] = (counts[ch] || 0) + 1; });

  for (let i = 0; i < wordLen; i++) {
    if (guessChars[i] === targetChars[i]) {
      states[i] = "green";
      counts[guessChars[i]]--;
    }
  }
  for (let i = 0; i < wordLen; i++) {
    if (states[i] === "green") continue;
    const ch = guessChars[i];
    if (counts[ch] > 0) {
      states[i] = "yellow";
      counts[ch]--;
    }
  }
  return { chars: guessChars, states };
}

const keyStateRank = { gray: 0, yellow: 1, green: 2 };
const keyStates = {};

function updateKeyStates(evaluated) {
  evaluated.chars.forEach((ch, i) => {
    const st = evaluated.states[i];
    const existing = keyStates[ch];
    if (!existing || keyStateRank[st] > keyStateRank[existing]) {
      keyStates[ch] = st;
    }
  });
}

function renderKeyboard() {
  const rows = ["qwertyuiop", "asdfghjkl", "ENTERzxcvbnmBACK", "SYMBOLS"];
  const kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  rows.forEach(rowStr => {
    const krow = document.createElement("div");
    krow.className = "krow";
    if (rowStr === "SYMBOLS") {
      const symbolKeys = [
        { key: "-", label: "-", cls: "symbol" },
        { key: " ", label: "space", cls: "space" },
        { key: "/", label: "/", cls: "symbol" },
      ];
      symbolKeys.forEach(sk => {
        const btn = document.createElement("button");
        btn.className = "key " + sk.cls;
        btn.textContent = sk.label;
        if (keyStates[sk.key]) btn.classList.add(keyStates[sk.key]);
        btn.addEventListener("click", () => handleKey(sk.key));
        krow.appendChild(btn);
      });
      kb.appendChild(krow);
      return;
    }
    let keys;
    if (rowStr.includes("ENTER")) {
      keys = ["ENTER", ...rowStr.replace("ENTER", "").replace("BACK", "").split(""), "BACK"];
    } else {
      keys = rowStr.split("");
    }
    keys.forEach(k => {
      const btn = document.createElement("button");
      btn.className = "key" + ((k === "ENTER" || k === "BACK") ? " wide" : "");
      btn.textContent = k === "BACK" ? "\u232B" : (k === "ENTER" ? "Enter" : k);
      if (k.length === 1 && keyStates[k]) {
        btn.classList.add(keyStates[k]);
      }
      btn.addEventListener("click", () => handleKey(k === "ENTER" ? "Enter" : (k === "BACK" ? "Backspace" : k)));
      krow.appendChild(btn);
    });
    kb.appendChild(krow);
  });
}

function showMessage(text) {
  const el = document.getElementById("message");
  el.textContent = text;
  if (text) setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, 1800);
}

function handleKey(key) {
  if (gameOver) return;
  if (key === "Enter") {
    if (currentGuess.some(c => !c)) {
      showMessage("Not enough characters");
      return;
    }
    const evaluated = evaluateGuess(currentGuess.slice());
    guesses.push(evaluated);
    updateKeyStates(evaluated);
    const won = currentGuess.join("") === target.term.toLowerCase();
    currentGuess = new Array(wordLen).fill("");
    renderBoard();
    renderKeyboard();

    if (won) {
      gameOver = true;
      endGame(true);
      return;
    }
    if (guesses.length >= MAX_GUESSES) {
      gameOver = true;
      endGame(false);
      return;
    }
    document.getElementById("guess-pill").textContent = "Guess " + (guesses.length + 1) + " of " + MAX_GUESSES;
  } else if (key === "Backspace") {
    for (let i = wordLen - 1; i >= 0; i--) {
      if (currentGuess[i]) { currentGuess[i] = ""; break; }
    }
    renderBoard();
  } else if (/^[a-z \-\/]$/i.test(key) && key.length === 1) {
    for (let i = 0; i < wordLen; i++) {
      if (!currentGuess[i]) { currentGuess[i] = key.toLowerCase(); break; }
    }
    renderBoard();
  }
}

function endGame(won) {
  document.getElementById("message").textContent = won ? "Nice work!" : "Out of guesses";
  const panel = document.getElementById("result-panel");
  document.getElementById("result-term").textContent = target.display || (target.term.charAt(0).toUpperCase() + target.term.slice(1));
  document.getElementById("result-def").textContent = target.def;
  panel.classList.add("show");
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleKey("Enter");
  else if (e.key === "Backspace") handleKey("Backspace");
  else if (e.key === " ") { e.preventDefault(); handleKey(" "); }
  else if (e.key === "-" || e.key === "/") handleKey(e.key);
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toLowerCase());
});

document.getElementById("new-word-btn").addEventListener("click", startGame);

populateCycleSelect();
const urlParams = new URLSearchParams(window.location.search);
const cycleParam = urlParams.get("cycle");
if (cycleParam && (cycleParam === "all" || CYCLES.some(c => String(c.num) === cycleParam))) {
  document.getElementById("cycle-select").value = cycleParam;
}
startGame();
</script>
